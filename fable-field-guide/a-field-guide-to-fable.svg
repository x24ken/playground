<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <!-- A Field Guide to Fable — 抽象地形図。等高線の密な場所=既知、疎らな破線=未知の領土 -->
  <defs>
    <pattern id="dots" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="36" cy="36" r="1.4" fill="#d9d1bf"/>
    </pattern>
  </defs>

  <rect width="1200" height="1600" fill="#f4efe6"/>
  <rect width="1200" height="1600" fill="url(#dots)"/>
  <rect x="56" y="56" width="1088" height="1488" fill="none" stroke="#2b2721" stroke-width="2"/>

  <!-- 既知の山塊 A（左・主峰）: 密な等高線 -->
  <g fill="none" stroke="#2b2721">
    <g stroke-width="2.2">
      <path transform="translate(430 660) scale(1.00) rotate(0) translate(-430 -660)"
        d="M 430 380 C 570 390 700 500 690 660 C 682 810 560 930 415 918 C 280 908 165 800 178 648 C 190 505 295 372 430 380 Z"/>
    </g>
    <g stroke-width="1.6" opacity="0.9">
      <path transform="translate(430 660) scale(0.84) rotate(5) translate(-430 -660)"
        d="M 430 380 C 570 390 700 500 690 660 C 682 810 560 930 415 918 C 280 908 165 800 178 648 C 190 505 295 372 430 380 Z"/>
      <path transform="translate(430 660) scale(0.68) rotate(11) translate(-430 -660)"
        d="M 430 380 C 570 390 700 500 690 660 C 682 810 560 930 415 918 C 280 908 165 800 178 648 C 190 505 295 372 430 380 Z"/>
      <path transform="translate(430 660) scale(0.53) rotate(18) translate(-430 -660)"
        d="M 430 380 C 570 390 700 500 690 660 C 682 810 560 930 415 918 C 280 908 165 800 178 648 C 190 505 295 372 430 380 Z"/>
      <path transform="translate(430 660) scale(0.39) rotate(26) translate(-430 -660)"
        d="M 430 380 C 570 390 700 500 690 660 C 682 810 560 930 415 918 C 280 908 165 800 178 648 C 190 505 295 372 430 380 Z"/>
      <path transform="translate(430 660) scale(0.26) rotate(35) translate(-430 -660)"
        d="M 430 380 C 570 390 700 500 690 660 C 682 810 560 930 415 918 C 280 908 165 800 178 648 C 190 505 295 372 430 380 Z"/>
      <path transform="translate(430 660) scale(0.14) rotate(45) translate(-430 -660)"
        d="M 430 380 C 570 390 700 500 690 660 C 682 810 560 930 415 918 C 280 908 165 800 178 648 C 190 505 295 372 430 380 Z"/>
    </g>
  </g>

  <!-- 既知の山塊 B（右上・小峰） -->
  <g fill="none" stroke="#2b2721">
    <g stroke-width="2">
      <path transform="translate(880 330) scale(1) rotate(0) translate(-880 -330)"
        d="M 880 200 C 950 205 1020 260 1014 335 C 1008 405 945 462 872 456 C 805 450 748 398 754 328 C 760 262 812 196 880 200 Z"/>
    </g>
    <g stroke-width="1.4" opacity="0.9">
      <path transform="translate(880 330) scale(0.72) rotate(9) translate(-880 -330)"
        d="M 880 200 C 950 205 1020 260 1014 335 C 1008 405 945 462 872 456 C 805 450 748 398 754 328 C 760 262 812 196 880 200 Z"/>
      <path transform="translate(880 330) scale(0.46) rotate(20) translate(-880 -330)"
        d="M 880 200 C 950 205 1020 260 1014 335 C 1008 405 945 462 872 456 C 805 450 748 398 754 328 C 760 262 812 196 880 200 Z"/>
      <path transform="translate(880 330) scale(0.22) rotate(34) translate(-880 -330)"
        d="M 880 200 C 950 205 1020 260 1014 335 C 1008 405 945 462 872 456 C 805 450 748 398 754 328 C 760 262 812 196 880 200 Z"/>
    </g>
  </g>

  <!-- 既知の山塊 C（左下） -->
  <g fill="none" stroke="#2b2721">
    <g stroke-width="2">
      <path transform="translate(330 1290) scale(1) rotate(0) translate(-330 -1290)"
        d="M 330 1180 C 400 1184 460 1230 456 1295 C 452 1356 398 1404 328 1400 C 264 1396 212 1352 216 1288 C 220 1228 266 1176 330 1180 Z"/>
    </g>
    <g stroke-width="1.4" opacity="0.9">
      <path transform="translate(330 1290) scale(0.66) rotate(12) translate(-330 -1290)"
        d="M 330 1180 C 400 1184 460 1230 456 1295 C 452 1356 398 1404 328 1400 C 264 1396 212 1352 216 1288 C 220 1228 266 1176 330 1180 Z"/>
      <path transform="translate(330 1290) scale(0.34) rotate(26) translate(-330 -1290)"
        d="M 330 1180 C 400 1184 460 1230 456 1295 C 452 1356 398 1404 328 1400 C 264 1396 212 1352 216 1288 C 220 1228 266 1176 330 1180 Z"/>
    </g>
  </g>

  <!-- 未知の領土（右下の広い余白）: 途切れた破線の等高線だけが漂う -->
  <g fill="none" stroke="#8a8172" stroke-width="1.6" stroke-dasharray="3 14" stroke-linecap="round">
    <path d="M 700 980 C 810 940 950 960 1050 1030"/>
    <path d="M 660 1120 C 790 1070 960 1090 1090 1180"/>
    <path d="M 700 1270 C 820 1220 970 1240 1080 1320"/>
    <path d="M 780 1410 C 880 1370 990 1385 1070 1440"/>
  </g>

  <!-- 踏査ルート: 既知から未知へ。境界で赤点、未知側は未確定の点線、終端は空白の円 -->
  <path d="M 140 1500 C 260 1420 240 1300 330 1240 C 430 1174 480 1050 470 940 C 462 850 520 780 600 760"
        fill="none" stroke="#2b2721" stroke-width="2.4" stroke-dasharray="12 8"/>
  <path d="M 600 760 C 700 740 760 820 800 900 C 836 972 880 1010 930 1030"
        fill="none" stroke="#c9502e" stroke-width="2.4" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="600" cy="760" r="9" fill="#c9502e"/>
  <circle cx="930" cy="1030" r="13" fill="none" stroke="#c9502e" stroke-width="2.6"/>
  <circle cx="930" cy="1030" r="3" fill="#c9502e"/>

  <!-- 観察者の印: 方位でなく「問い」を指すアスタリスク -->
  <g stroke="#2b2721" stroke-width="2.4" stroke-linecap="round">
    <line x1="980" y1="140" x2="980" y2="200"/>
    <line x1="950" y1="170" x2="1010" y2="170"/>
    <line x1="959" y1="149" x2="1001" y2="191"/>
    <line x1="1001" y1="149" x2="959" y2="191"/>
  </g>
  <circle cx="980" cy="170" r="44" fill="none" stroke="#2b2721" stroke-width="1.4" stroke-dasharray="4 7"/>

  <!-- 図版番号ふうの目盛 -->
  <g stroke="#2b2721" stroke-width="1.6">
    <line x1="56" y1="1104" x2="76" y2="1104"/>
    <line x1="1124" y1="640" x2="1144" y2="640"/>
    <line x1="600" y1="56" x2="600" y2="76"/>
  </g>

  <!-- タイトル -->
  <g font-family="Futura, 'Avenir Next', 'Century Gothic', sans-serif" fill="#2b2721">
    <text x="600" y="112" font-size="17" letter-spacing="14" text-anchor="middle">FIG. 5 — TERRA INCOGNITA</text>
    <text x="600" y="1476" font-size="26" letter-spacing="18" text-anchor="middle">A FIELD GUIDE TO FABLE</text>
    <text x="600" y="1512" font-size="13" letter-spacing="8" text-anchor="middle" fill="#8a8172">FINDING YOUR UNKNOWNS · 盲点図</text>
  </g>
</svg>
